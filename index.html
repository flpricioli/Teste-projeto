<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventário de Estoque</title>
    <!-- Biblioteca ZXing para leitura de código de barras e QR Code -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2c2c2c;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --primary: #2196f3;
            --success: #4caf50;
            --danger: #f44336;
            --border: #333333;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        h2, h3 { margin-top: 0; }

        .container { padding: 15px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-card);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: var(--success);
            border-bottom: 3px solid var(--success);
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .btn-scan {
            background-color: var(--success);
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: #555; color: white; }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        #video-container {
            display: none;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid var(--success);
        }
        video { width: 100%; height: auto; display: block; }

        .info-card {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }
        .info-card p { margin: 5px 0; font-size: 14px; }
        .info-card strong { color: white; }

        .list-item {
            background-color: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .list-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .kpi-value { font-size: 24px; font-weight: bold; margin: 10px 0 5px; }
        .kpi-label { font-size: 12px; color: var(--text-muted); }

        .text-success { color: var(--success) !important; }
        .text-danger { color: var(--danger) !important; }
        .text-warning { color: #ff9800 !important; }

        #feedback-msg {
            display: none;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="tab-scan" class="tab-content active container">
        <h2>Conferência de Estoque</h2>
        
        <button id="btn-start-scan" class="btn btn-scan">📷 Escanear Código</button>
        
        <div id="video-container">
            <video id="video"></video>
            <button id="btn-stop-scan" class="btn btn-secondary" style="border-radius: 0; margin-bottom: 0;">Cancelar Câmera</button>
        </div>

        <div id="feedback-msg"></div>

        <div class="form-group">
            <label for="codigo-input">Código (EAN ou SKU)</label>
            <input type="text" id="codigo-input" placeholder="Digite ou escaneie o código" autocomplete="off">
        </div>

        <div id="product-info-panel" class="info-card" style="display: none;">
            <h3 id="info-desc" style="margin-top:0; margin-bottom: 10px; color: var(--primary);">Produto</h3>
            <p><strong>SKU:</strong> <span id="info-sku"></span></p>
            <p><strong>Localização:</strong> <span id="info-loc"></span></p>
            <p><strong>Qtd. Sistema:</strong> <span id="info-qtd-sis"></span> <span id="info-unidade"></span></p>
        </div>

        <div class="form-group">
            <label for="qtd-fisica-input">Quantidade Física Contada</label>
            <input type="number" id="qtd-fisica-input" placeholder="0" step="0.01">
        </div>

        <button id="btn-salvar" class="btn btn-primary">💾 Salvar Contagem</button>
    </div>

    <div id="tab-list" class="tab-content container">
        <h2>Registros da Sessão</h2>
        <button id="btn-export" class="btn btn-primary" style="margin-bottom: 20px;">📊 Exportar CSV</button>
        
        <div id="contagens-list">
            <p style="text-align: center; color: var(--text-muted);">Nenhuma contagem realizada ainda.</p>
        </div>
    </div>

    <div id="tab-dash" class="tab-content container">
        <h2>KPIs de Acuracidade</h2>
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Acuracidade</div>
                <div id="kpi-acuracidade" class="kpi-value text-success">100%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Itens Conferidos</div>
                <div id="kpi-total" class="kpi-value">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Com Divergência</div>
                <div id="kpi-divergentes" class="kpi-value text-warning">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Valor em Risco</div>
                <div id="kpi-risco" class="kpi-value text-danger">R$ 0,00</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('scan', this)">
            <div style="font-size: 20px; margin-bottom: 4px;">🔍</div>
            Escanear
        </div>
        <div class="nav-item" onclick="switchTab('list', this)">
            <div style="font-size: 20px; margin-bottom: 4px;">📋</div>
            Contagens
        </div>
        <div class="nav-item" onclick="switchTab('dash', this)">
            <div style="font-size: 20px; margin-bottom: 4px;">📈</div>
            Dashboard
        </div>
    </nav>

    <script>
        const bancoProdutos = [
            { id_sku: "SKU001", id_ean: "7891000000001", descricao: "Parafuso Sextavado M8", unidade: "UN", valor_unitario: 0.50, localizacao: "A-01-01", quantidade_sistema: 500 },
            { id_sku: "SKU002", id_ean: "7891000000002", descricao: "Tinta Branca Acrílica 18L", unidade: "GL", valor_unitario: 120.00, localizacao: "B-02-05", quantidade_sistema: 50 },
            { id_sku: "SKU003", id_ean: "7891000000003", descricao: "Caixa de Papelão 50x50x50", unidade: "UN", valor_unitario: 3.50, localizacao: "C-01-10", quantidade_sistema: 300 },
            { id_sku: "SKU004", id_ean: "7891000000004", descricao: "Placa Mãe Industrial H61", unidade: "UN", valor_unitario: 450.00, localizacao: "D-05-02", quantidade_sistema: 80 },
            { id_sku: "SKU005", id_ean: "7891000000005", descricao: "Fita Adesiva Transparente", unidade: "RL", valor_unitario: 4.00, localizacao: "C-02-01", quantidade_sistema: 250 },
            { id_sku: "SKU006", id_ean: "7891000000006", descricao: "EPI - Luva de Raspa", unidade: "PR", valor_unitario: 15.00, localizacao: "E-01-04", quantidade_sistema: 120 },
            { id_sku: "SKU007", id_ean: "7891000000007", descricao: "Rolamento Esférico 6204", unidade: "UN", valor_unitario: 45.00, localizacao: "A-03-02", quantidade_sistema: 60 },
            { id_sku: "SKU008", id_ean: "7891000000008", descricao: "Cabo de Cobre 2.5mm", unidade: "RL", valor_unitario: 180.00, localizacao: "D-01-01", quantidade_sistema: 150 },
            { id_sku: "SKU009", id_ean: "7891000000009", descricao: "Óleo Lubrificante AW68 20L", unidade: "BD", valor_unitario: 320.00, localizacao: "B-03-01", quantidade_sistema: 90 },
            { id_sku: "SKU010", id_ean: "7891000000010", descricao: "Capacete de Segurança Branco", unidade: "UN", valor_unitario: 25.00, localizacao: "E-02-01", quantidade_sistema: 200 }
        ];

        let contagens = [];
        let produtoAtual = null;
        let codeReader = null;

        const inputCodigo = document.getElementById('codigo-input');
        const inputQtd = document.getElementById('qtd-fisica-input');
        const painelInfo = document.getElementById('product-info-panel');
        const feedbackMsg = document.getElementById('feedback-msg');
        
        window.switchTab = function(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
            
            if(tabId === 'dash') atualizarDashboard();
            if(tabId === 'list') renderizarLista();
        };

        // --- CÂMERA BLINDADA (Compatível com PC e Mobile) ---
        document.getElementById('btn-start-scan').addEventListener('click', async () => {
            try {
                const videoContainer = document.getElementById('video-container');
                videoContainer.style.display = 'block';
                mostrarFeedback('Iniciando câmera...', 'success');

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Seu navegador não suporta acesso à câmera.");
                }

                // Permissão (Aceita qualquer câmera, não trava no PC)
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop()); 

                if (typeof ZXing === 'undefined') {
                    throw new Error("Biblioteca do leitor não carregou. Verifique a internet.");
                }

                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }

                const videoInputDevices = await codeReader.listVideoInputDevices();
                if (videoInputDevices.length === 0) {
                    throw new Error("Nenhuma câmera detectada pelo dispositivo.");
                }

                let selectedDeviceId = videoInputDevices[0].deviceId; 
                const cameraTraseira = videoInputDevices.find(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('environment') ||
                    device.label.toLowerCase().includes('traseira')
                );
                
                if (cameraTraseira) {
                    selectedDeviceId = cameraTraseira.deviceId;
                }

                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result) {
                        inputCodigo.value = result.text;
                        pararCamera();
                        buscarProduto();
                        mostrarFeedback('Código lido!', 'success');
                    }
                });

            } catch (err) {
                alert("AVISO: " + err.message);
                mostrarFeedback('Erro: ' + err.message, 'danger');
                document.getElementById('video-container').style.display = 'none';
            }
        });

        document.getElementById('btn-stop-scan').addEventListener('click', pararCamera);

        function pararCamera() {
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById('video-container').style.display = 'none';
        }

        inputCodigo.addEventListener('input', buscarProduto);

        function buscarProduto() {
            const codigoDigitado = inputCodigo.value.trim().toUpperCase();
            if (codigoDigitado.length < 3) {
                painelInfo.style.display = 'none';
                produtoAtual = null;
                return;
            }

            const produto = bancoProdutos.find(p => p.id_ean === codigoDigitado || p.id_sku.toUpperCase() === codigoDigitado);

            if (produto) {
                produtoAtual = produto;
                document.getElementById('info-desc').innerText = produto.descricao;
                document.getElementById('info-sku').innerText = produto.id_sku;
                document.getElementById('info-loc').innerText = produto.localizacao;
                document.getElementById('info-qtd-sis').innerText = produto.quantidade_sistema;
                document.getElementById('info-unidade').innerText = produto.unidade;
                painelInfo.style.display = 'block';
                inputQtd.focus();
            } else {
                painelInfo.style.display = 'none';
                produtoAtual = null;
            }
        }

        document.getElementById('btn-salvar').addEventListener('click', () => {
            if (!produtoAtual) {
                mostrarFeedback('Busque ou escaneie um produto válido.', 'danger');
                return;
            }

            const qtdFisica = parseFloat(inputQtd.value);
            if (isNaN(qtdFisica) || qtdFisica < 0) {
                mostrarFeedback('Insira uma quantidade válida.', 'danger');
                return;
            }

            const divergencia = qtdFisica - produtoAtual.quantidade_sistema;

            contagens.push({
                codigo: produtoAtual.id_ean,
                sku: produtoAtual.id_sku,
                descricao: produtoAtual.descricao,
                valor_unitario: produtoAtual.valor_unitario,
                qtd_sistema: produtoAtual.quantidade_sistema,
                qtd_fisica: qtdFisica,
                divergencia: divergencia,
                data_hora: new Date().toLocaleString('pt-BR')
            });
            
            inputCodigo.value = '';
            inputQtd.value = '';
            painelInfo.style.display = 'none';
            produtoAtual = null;

            mostrarFeedback('Salvo com sucesso!', 'success');
        });

        // --- CORREÇÃO DO ERRO SYNTAX APLICADA AQUI ---
        function mostrarFeedback(msg, tipo) {
            feedbackMsg.innerText = msg;
            feedbackMsg.style.backgroundColor = tipo === 'success' ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)';
            feedbackMsg.style.color = tipo === 'success' ? '#4caf50' : '#f44336';
            feedbackMsg.style.border = `1px solid ${tipo === 'success' ? '#4caf50' : '#f44336'}`;
            feedbackMsg.style.display = 'block';
            setTimeout(() => { feedbackMsg.style.display = 'none'; }, 3000);
        }

        function renderizarLista() {
            const listContainer = document.getElementById('contagens-list');
            if (contagens.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhuma contagem.</p>';
                return;
            }

            const html = contagens.slice().reverse().map(c => {
                let corDivergencia = 'divergence-zero';
                let sinal = '';
                if (c.divergencia > 0) { corDivergencia = 'text-success'; sinal = '+'; }
                else if (c.divergencia < 0) { corDivergencia = 'text-danger'; }

                return `
                <div class="list-item">
                    <div class="list-item-header">
                        <strong>${c.sku}</strong>
                        <span style="font-size: 12px; color: var(--text-muted);">${c.data_hora}</span>
                    </div>
                    <div style="margin-bottom: 5px;">${c.descricao}</div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px;">
                        <span>Sis: ${c.qtd_sistema} | Fís: ${c.qtd_fisica}</span>
                        <span class="${corDivergencia}">Div: ${sinal}${c.divergencia}</span>
                    </div>
                </div>
                `;
            }).join('');
            listContainer.innerHTML = html;
        }

        function atualizarDashboard() {
            const totalConferidos = contagens.length;
            const itensDivergentes = contagens.filter(c => c.divergencia !== 0).length;
            let acuracidade = 100;
            if (totalConferidos > 0) {
                acuracidade = ((totalConferidos - itensDivergentes) / totalConferidos) * 100;
            }

            const valorEmRisco = contagens.reduce((acc, c) => acc + (Math.abs(c.divergencia) * c.valor_unitario), 0);

            document.getElementById('kpi-total').innerText = totalConferidos;
            document.getElementById('kpi-divergentes').innerText = itensDivergentes;
            
            const kpiAcuracidade = document.getElementById('kpi-acuracidade');
            kpiAcuracidade.innerText = acuracidade.toFixed(1) + '%';
            kpiAcuracidade.className = `kpi-value ${acuracidade >= 95 ? 'text-success' : (acuracidade >= 80 ? 'text-warning' : 'text-danger')}`;
            document.getElementById('kpi-risco').innerText = 'R$ ' + valorEmRisco.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        }

        document.getElementById('btn-export').addEventListener('click', () => {
            if (contagens.length === 0) { alert("Sem dados."); return; }
            let csvContent = "Codigo_EAN,SKU,Descricao,Quantidade_Sistema,Quantidade_Fisica,Divergencia,Valor_Unitario,Data_Hora\n";
            contagens.forEach(c => {
                const desc = `"${c.descricao.replace(/"/g, '""')}"`;
                csvContent += `${c.codigo},${c.sku},${desc},${c.qtd_sistema},${c.qtd_fisica},${c.divergencia},${c.valor_unitario},${c.data_hora}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `inventario_${new Date().getTime()}.csv`;
            link.click();
        });
    </script>
</body>
</html>
